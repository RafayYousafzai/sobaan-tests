name: Daily Website Health Check

on:
  schedule:
    - cron: '0 9 * * *' # Runs everyday at 2:00 PM PKT (9:00 AM UTC)
  workflow_dispatch: # Allows manual trigger

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests
      continue-on-error: true
      id: playwright
      run: npx playwright test

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Notify n8n Webhook
      if: always()
      run: |
        # Your n8n webhook URL
        WEBHOOK_URL="https://n8n.coderesults.tech/webhook-test/14f64b3c-958d-4ff8-953a-05754c53ce28"
        
        # Determine test status
        if [ "${{ steps.playwright.outcome }}" == "failure" ]; then
          STATUS="failed"
          MESSAGE="Tests failed - please check the report"
        elif [ "${{ steps.playwright.outcome }}" == "success" ]; then
          STATUS="success"
          MESSAGE="All tests passed successfully"
        else
          STATUS="unknown"
          MESSAGE="Tests completed with unknown status"
        fi

        # Send notification to n8n
        curl -X POST "$WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d @- << EOF
        {
          "project": "Sobaan Salts Website",
          "status": "$STATUS",
          "message": "$MESSAGE",
          "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "branch": "${{ github.ref_name }}",
          "commit": "${{ github.sha }}",
          "actor": "${{ github.actor }}"
        }
        EOF